name: Deploy Static Site via AWS CDK

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '098689768734'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build static Astro site
        env:
          ASTRO_STATIC_BUILD: 'true'
        run: npm run build

      - name: Verify static build output
        run: |
          test -f dist/client/index.html
          test -f dist/client/blog/index.html

      - name: Install CDK dependencies
        run: npm ci --prefix cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$AWS_ACCOUNT_ID" ]; then
            echo "Configured credentials target account $actual_account_id, not $AWS_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Deploy static site and invalidate CloudFront
        working-directory: cdk
        run: npx cdk deploy CdkStack --require-approval never
