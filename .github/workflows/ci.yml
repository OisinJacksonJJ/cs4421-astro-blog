name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '098689768734'
  ECR_REPOSITORY: astro-blog

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run Unit Tests
        run: npm run test:unit -- --run

      - name: Build Production Site
        run: npm run build

      - name: Run End-to-End Tests
        run: npm run test:e2e

      - name: Build Container Image
        run: docker build --tag whats-in-a-kickout:ci .

  validate-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install Site Dependencies
        run: npm ci
        working-directory: .

      - name: Build Site Assets for CDK Synthesis
        run: npm run build
        working-directory: .

      - name: Install CDK Dependencies
        run: npm ci

      - name: Build CDK TypeScript
        run: npm run build

      - name: Run CDK Tests
        run: npm test -- --runInBand

      - name: Synthesize CloudFormation Templates
        run: npx cdk synth

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-site, validate-cdk]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$AWS_ACCOUNT_ID" ]; then
            echo "Configured credentials target account $actual_account_id, not $AWS_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Create ECR repository if needed
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
