name: Deploy Container to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-container
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '098689768734'
  ECR_REPOSITORY: astro-blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build Astro site for CDK assets
        run: npm run build

      - name: Install CDK dependencies
        run: npm ci --prefix cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$AWS_ACCOUNT_ID" ]; then
            echo "Configured credentials target account $actual_account_id, not $AWS_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Create ECR repository if needed
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy ECS service
        working-directory: cdk
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          npx cdk deploy AstroBlogEcsStack
          --context imageTag="$IMAGE_TAG"
          --require-approval never
